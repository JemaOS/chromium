<style include="oobe-dialog-host-styles"></style>
<oobe-adaptive-dialog role="dialog" for-step="signup,signin"
   jemaos-layout
   animation-url="animations/jemaos_signin.json"
   aria-label$="[[i18nDynamic(locale, 'jemaosLocalSigninTitle')]]"
>
  <iron-icon slot="icon" icon="oobe-32:avatar"></iron-icon>
  <h1 slot="title" for-step="signup">
    [[i18nDynamic(locale, 'jemaosLocalSignupTitle')]]
  </h1>
  <h1 slot="title" for-step="signin">
    [[i18nDynamic(locale, 'jemaosLocalSigninTitle')]]
  </h1>
  <div slot="subtitle"></div>
  <paper-progress slot="progress" hidden="[[!loading]]" indeterminate>
  </paper-progress>
  <div slot="content" class="landscape-header-aligned" hidden="[[loading]]">
    <div class="layout vertical">
      <cr-input slot="inputs" id="userInput" required
          class="focus-on-show"
          invalid="[[userInvalid]]" domain="[[userRealm]]"
                                    value="{{userName}}"
          label="[[i18nDynamic(locale, 'jemaosLocalSigninUsername')]]"
          maxlength="64"
          on-keydown="onKeydownUserInput_"
          error-message="[[i18nDynamic(locale, 'jemaosLocalSigninInvalidUsername')]]">
        <span slot="inline-suffix" id="userRealm">
          [[userRealm]]
        </span>
      </cr-input>
      <cr-input slot="inputs" id="signinPasswordInput" type="password" required
          for-step="signin"
          invalid="[[authSigninPasswordInvalid]]"
          label="[[i18nDynamic(locale, 'jemaosLocalSigninPassword')]]"
          maxlength="64"
          on-keydown="onKeydownAuthSigninPasswordInput_"
          error-message="[[i18nDynamic(locale, 'jemaosLocalSigninExistLocalAccountErrorMessage')]]">
      </cr-input>
      <cr-input slot="inputs" id="passwordInput" type="password" required
          for-step="signup"
          invalid="[[authPasswordInvalid]]"
          label="[[i18nDynamic(locale, 'jemaosLocalSigninPassword')]]"
          maxlength="64"
          on-keydown="onKeydownAuthPasswordInput_"
          error-message="[[getInvalidPasswordMessage_(locale, errorState)]]">
      </cr-input>
      <cr-input slot="inputs" id="passwordConfirmInput" type="password" required
          for-step="signup"
          invalid="[[authPasswordConfirmInvalid]]"
          label="[[i18nDynamic(locale, 'jemaosLocalSigninPasswordConfirm')]]"
          maxlength="64"
          on-keydown="onKeydownAuthPasswordConfirmInput_"
          error-message="[[i18nDynamic(locale, 'jemaosLocalSigninPasswordConfirmError')]]">
      </cr-input>
    </div>
  </div>
  <div slot="back-navigation" hidden="[[loading]]">
    <oobe-back-button id="backButton" on-click="onBackButton_"></oobe-back-button>
  </div>
  <div slot="bottom-buttons" hidden="[[loading]]">
    <oobe-text-button id="signinButton" on-click="onGotoSigninClicked_" text-key="jemaosLocalSigninExistLocalAccountButtonText" hidden="[[!showSigninButton_]]"></oobe-text-button>
    <!--
      Hide "Create a new local account" entry point from the footer *only when online*.
      Show it when offline so the user can create a local account without internet.
    -->
    <oobe-text-button for-step="signin" id="signupButton" on-click="onGotoSignupClicked_" text-key="jemaosLocalSigninNewLocalAccountButtonText" hidden="[[isOnline_]]"></oobe-text-button>
    <oobe-next-button id="nextButton" on-click="onSubmit_"></oobe-next-button>
  </div>
</oobe-adaptive-dialog>
