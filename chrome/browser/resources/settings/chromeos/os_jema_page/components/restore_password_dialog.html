<style include="cr-shared-style">
  :host {
    --cr-dialog-width: 512px;
  }
  
  .password-container {
    margin: 16px 0;
  }
  
  .file-info {
    margin-bottom: 16px;
    padding: 12px;
    background-color: var(--cr-card-background-color);
    border-radius: 4px;
    color: var(--cr-secondary-text-color);
    font-size: 13px;
  }
  
  .checkbox-container {
    margin-top: 8px;
    display: flex;
    align-items: center;
  }
  
  input[type="checkbox"] {
    margin-right: 8px;
  }
  
  .action-button[disabled] {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>

<cr-dialog id="dialog" close-text="Cancel" show-on-attach>
  <div slot="title">Enter Backup Password</div>
  <div slot="body">
    <div class="file-info">
      <strong>Restore File:</strong> [[getFileName_(restoreFile)]]
    </div>
    
    <div>Enter the password used to encrypt this backup, or check "No password" if the backup is unencrypted.</div>
    
    <div class="password-container">
      <cr-input 
        id="passwordInput"
        label="Password"
        type="[[getPasswordInputType_(showPassword_)]]"
        value="{{password_}}"
        placeholder="Enter backup password"
        disabled="[[noPassword_]]">
      </cr-input>
      
      <div class="checkbox-container">
        <input type="checkbox" 
               id="showPasswordCheckbox"
               checked="{{showPassword_::change}}"
               disabled="[[noPassword_]]">
        <label for="showPasswordCheckbox">Show password</label>
      </div>
    </div>
    
    <div class="checkbox-container">
      <input type="checkbox" 
             id="noPasswordCheckbox"
             checked="{{noPassword_::change}}"
             on-change="onNoPasswordChanged_">
      <label for="noPasswordCheckbox">No password (unencrypted backup)</label>
    </div>
  </div>
  
  <div slot="button-container">
    <cr-button class="cancel-button" on-click="onCancelClick_">
      Cancel
    </cr-button>
    <cr-button class="action-button" 
               on-click="onRestoreClick_"
               disabled="[[!isRestoreEnabled_]]">
      Restore
    </cr-button>
  </div>
</cr-dialog>
