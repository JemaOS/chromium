<style include="cr-shared-style settings-shared">
  :host {
    --cr-dialog-width: 400px;
  }

  .dialog-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--cr-primary-text-color);
    margin-bottom: 16px;
  }

  .dialog-content {
    color: var(--cr-secondary-text-color);
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .success-icon {
    color: var(--google-green-600);
    margin-right: 8px;
  }

  .error-icon {
    color: var(--google-red-600);
    margin-right: 8px;
  }

  @media (prefers-color-scheme: dark) {
    .success-icon {
      color: var(--google-green-300);
    }

    .error-icon {
      color: var(--google-red-300);
    }
  }

  .dialog-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }

  .action-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>

<cr-dialog id="dialog" close-text="$i18n{jemaosSettingsClose}">
  <div slot="title">
    <div class="dialog-header">
      <iron-icon hidden="[[!isSuccess]]" class="success-icon" icon="cr:check-circle"></iron-icon>
      <iron-icon hidden="[[isSuccess]]" class="error-icon" icon="cr:error"></iron-icon>
      <span class="dialog-title">[[getTitle_(isSuccess)]]</span>
    </div>
  </div>

  <div slot="body">
    <div class="dialog-content">
      [[message]]
    </div>
  </div>

  <div slot="button-container">
    <div class="action-buttons">
      <cr-button class="action-button" on-click="onOkClick_">
        $i18n{confirm}
      </cr-button>
    </div>
  </div>
</cr-dialog>
