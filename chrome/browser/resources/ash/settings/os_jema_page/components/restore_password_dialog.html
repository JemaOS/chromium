<style include="cr-shared-style">
  :host {
    --cr-dialog-width: 500px;
  }

  .dialog-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--cr-primary-text-color);
    margin-bottom: 16px;
  }

  .dialog-content {
    color: var(--cr-secondary-text-color);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  cr-input {
    margin-top: 16px;
  }

  .file-select-container {
    margin-top: 16px;
  }

  .file-select-label {
    font-size: 12px;
    color: var(--cr-secondary-text-color);
    margin-bottom: 8px;
  }

  .file-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--cr-input-border-color, #dadce0);
    border-radius: 4px;
    background-color: var(--cr-input-background-color, white);
    color: var(--cr-primary-text-color);
    font-size: 14px;
    cursor: pointer;
  }

  .file-select:focus {
    outline: none;
    border-color: var(--cr-focus-outline-color, #1a73e8);
    box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
  }

  .file-option {
    padding: 8px;
  }

  .loading-message {
    margin-top: 16px;
    color: var(--cr-secondary-text-color);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .no-files-message {
    margin-top: 16px;
    color: var(--cros-sys-error, #d93025);
    font-size: 14px;
  }

  .action-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>

<cr-dialog id="dialog" close-text="$i18n{jemaosSettingsClose}">
  <div slot="title">
    <div class="dialog-title">$i18n{jemaosSettingsRestorePasswordDialogTitle}</div>
  </div>

  <div slot="body">
    <div class="dialog-content">
      $i18n{jemaosSettingsRestorePasswordDialogMessage}
    </div>
    <cr-input id="passwordInput" type="password" label="$i18n{jemaosSettingsRestorePasswordLabel}" value="{{password_}}"
      on-keypress="onKeyPress_" error-message="$i18n{jemaosSettingsRestorePasswordError}">
    </cr-input>
    <template is="dom-if" if="[[isCloudRestore]]">
      <template is="dom-if" if="[[loadingFiles_]]">
        <div class="loading-message">
          <span>$i18n{jemaosSettingsLoadingBackupFiles}</span>
        </div>
      </template>
      <template is="dom-if" if="[[!loadingFiles_]]">
        <template is="dom-if" if="[[hasBackupFiles_]]">
          <div class="file-select-container">
            <div class="file-select-label">$i18n{jemaosSettingsSelectBackupFileLabel}</div>
            <select class="file-select" on-change="onFileSelected_">
              <option value="">$i18n{jemaosSettingsSelectBackupFilePlaceholder}</option>
              <template is="dom-repeat" items="[[backupFiles_]]">
                <option value="[[item.fileKey]]">[[formatDate_(item.lastModified)]] - [[formatFileSize_(item.size)]]
                </option>
              </template>
            </select>
          </div>
        </template>
        <template is="dom-if" if="[[!hasBackupFiles_]]">
          <div class="no-files-message">
            $i18n{jemaosSettingsNoBackupFilesFound}
          </div>
        </template>
      </template>
    </template>
  </div>

  <div slot="button-container">
    <div class="action-buttons">
      <cr-button class="cancel-button" on-click="onCancelClick_">
        $i18n{cancel}
      </cr-button>
      <cr-button class="action-button" on-click="onRestoreClick_" disabled="[[!canRestore_]]">
        $i18n{jemaosSettingsRestoreButtonLabel}
      </cr-button>
    </div>
  </div>
</cr-dialog>
