<style include="cr-shared-style">
  :host {
    --cr-dialog-width: 400px;
  }

  .dialog-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--cr-primary-text-color);
    margin-bottom: 16px;
  }

  .dialog-content {
    color: var(--cr-secondary-text-color);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  cr-input {
    margin-top: 16px;
  }

  .action-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>

<cr-dialog id="dialog" close-text="Close">
  <div slot="title">
    <div class="dialog-title">$i18n{jemaosSettingsRestorePasswordDialogTitle}</div>
  </div>

  <div slot="body">
    <div class="dialog-content">
      $i18n{jemaosSettingsRestorePasswordDialogMessage}
    </div>
    <cr-input
      id="passwordInput"
      type="password"
      label="$i18n{jemaosSettingsRestorePasswordLabel}"
      value="{{password_}}"
      on-keypress="onKeyPress_"
      error-message="$i18n{jemaosSettingsRestorePasswordError}">
    </cr-input>
  </div>

  <div slot="button-container">
    <div class="action-buttons">
      <cr-button class="cancel-button" on-click="onCancelClick_">
        $i18n{cancel}
      </cr-button>
      <cr-button class="action-button" on-click="onRestoreClick_" disabled="[[!password_]]">
        $i18n{jemaosSettingsRestoreButtonLabel}
      </cr-button>
    </div>
  </div>
</cr-dialog>
