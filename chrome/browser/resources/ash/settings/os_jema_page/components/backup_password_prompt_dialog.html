<style include="cr-shared-style settings-shared">
  cr-dialog::part(dialog) {
    width: 512px;
    background-color: var(--cros-sys-dialog_container);
  }

  cr-input {
    --cr-input-background-color: var(--cros-sys-input_field_on_base);
    --cr-input-color: var(--cros-sys-on_surface);
    --cr-form-field-label-color: var(--cros-sys-on_surface);
  }

  #passwordPrompt {
    padding-bottom: 20px;
    padding-inline-end: 0;
    padding-inline-start: 0;
    color: var(--cr-secondary-text-color);
  }
</style>
<cr-dialog id="dialog">
  <div slot="title">$i18n{jemaosSettingsBackupPasswordPromptTitle}</div>
  <div slot="body">
    <div id="passwordPrompt" class="cr-row first">
      $i18n{jemaosSettingsBackupPasswordPromptText}
    </div>
    <cr-input id="passwordInput" type="password" placeholder="$i18n{passwordPromptPasswordLabel}"
      invalid="[[passwordInvalid_]]" error-message="$i18n{passwordPromptInvalidPassword}" value="{{inputValue_}}"
      aria-disabled="false">
    </cr-input>
  </div>
  <div slot="button-container">
    <cr-button class="cancel-button" on-click="onCancelTap_">
      $i18n{cancel}
    </cr-button>

    <cr-button id="confirmButton" class="action-button" disabled$="[[!isConfirmEnabled_(inputValue_, passwordInvalid_,
            waitingForPasswordCheck_)]]" on-click="submitPassword_">
      $i18n{confirm}
    </cr-button>
  </div>
</cr-dialog>
